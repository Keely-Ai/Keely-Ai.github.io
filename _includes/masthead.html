<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__brand" href="#about-me">{{ site.author.name }}</a>
    <div class="masthead__right">
      <nav id="site-nav" class="masthead__nav">
        {% for link in site.data.navigation.main %}
          <a href="{{ link.url }}">{{ link.title }}</a>
        {% endfor %}
      </nav>
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="light" aria-pressed="true" aria-label="Light mode" title="Light mode">{% include icon.html name="sun" %}</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark mode" title="Dark mode">{% include icon.html name="moon" %}</button>
      </div>
      <button class="masthead__toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
