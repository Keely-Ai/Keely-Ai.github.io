# Site settings. Jekyll does not reload this file while `jekyll serve` is running;
# restart the server after editing it.

title                    : "Xinyue Ai"
description              : "Xinyue Ai — CIS Ph.D. student at the University of Pennsylvania working on generative models."
repository               : "Keely-Ai/Keely-Ai.github.io"

# Google Analytics (optional): https://analytics.google.com/analytics/
google_analytics_id      :

# Search engine verification (optional)
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Profile shown in the sidebar
author:
  name             : "Xinyue Ai"
  name_native      : "艾心玥"
  avatar           : "images/me.jpg"
  position         : "CIS Ph.D. Student"
  bio              : "University of Pennsylvania"
  interests        : ["Generative models", "Diffusion & flows", "Sampling"]
  location         : "Philadelphia, USA"
  email            : "aichen782@gmail.com"
  googlescholar    : "https://scholar.google.com/citations?user=KogjUYwAAAAJ"
  github           : "Keely-Ai"
  twitter          : "KeelyAi04"
  linkedin         :   # LinkedIn username, e.g. "xinyue-ai"
  cv               :   # path or URL to a CV PDF, e.g. "files/cv.pdf"


# Build
include:
  - _pages
  - files
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run_server.sh
  - .sass-cache
  - .jekyll-cache
  - vendor

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  style: compressed

permalink: /:categories/:title/
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
